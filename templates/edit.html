<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
</head>
<body>
    <h1>Edit Task</h1>

    <form method="POST">

    <label>Task</label>
    <input type="text" name="task" value="{{ task[1] }}">

    <label>Subject</label>
    <input type="text" name="subject" value="{{ task[2] }}">

    <label>Priority</label>
    <select name="priority">
        <option value="1" {% if task[3] == 1 %}selected{% endif %}>Low</option>
        <option value="2" {% if task[3] == 2 %}selected{% endif %}>Medium</option>
        <option value="3" {% if task[3] == 3 %}selected{% endif %}>High</option>
    </select>

    <label>Due Date</label>
    <input type="date" name="due_date" value="{{ task[4] }}">

    <button type="submit">Save Changes</button>

</form>

</body>
</html>
